<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style type="text/css">
    <!--
    body {
        background-color: #000000;
        margin:0;
        padding:0;
    }
    -->
</style>

  </head>

  <body>
    <div id="app" style="height: 100vh; position: relative; top: 0">
      <!-- Webamp will render as a child of this div -->
    </div>
    <script type="module">
      import Webamp from "https://unpkg.com/webamp@^2";
      const webamp = new Webamp({
        initialTracks: [
          {
            metaData: {
              artist: "DJ Mike Llama",
              title: "Llama Whippin' Intro",
            },
            // NOTE: Your audio file must be served from the same domain as your HTML
            // file, or served with permissive CORS HTTP headers:
            // https://docs.webamp.org/docs/guides/cors
            url: "https://cdn.jsdelivr.net/gh/captbaritone/webamp@43434d82cfe0e37286dbbe0666072dc3190a83bc/mp3/llama-2.91.mp3",
            duration: 5.322286,
          },
          {
            metaData: {
              artist: "Some Artist",
              title: "Title of Second Track",
            },
            url: "https://cdn.jsdelivr.net/gh/captbaritone/webamp@43434d82cfe0e37286dbbe0666072dc3190a83bc/mp3/llama-2.91.mp3",
            duration: 5.322286,
          },
        ],
        windowLayout: {
            main: { position: { top: 0, left: 0 } },
            equalizer: { position: { top: 116, left: 0 } },
            playlist: { position: { top: 232, left: 0 }, size: { extraHeight: 3, extraWidth: 0 }, },
        },
      });

      webamp.renderInto(document.getElementById("app"));
    </script>
  </body>
</html>
